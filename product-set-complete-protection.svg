<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faec"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80bb03"/>
      <stop offset="100%" stop-color="#a3d916"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- connecting lines -->
  <line x1="400" y1="300" x2="270" y2="470" stroke="#cfe9b8" stroke-width="6"/>
  <line x1="400" y1="300" x2="530" y2="470" stroke="#cfe9b8" stroke-width="6"/>
  <line x1="270" y1="470" x2="530" y2="470" stroke="#cfe9b8" stroke-width="6"/>

  <!-- RT Phone Neutraliser circle (bottom left) -->
  <circle cx="270" cy="470" r="128" fill="url(#ring)"/>
  <circle cx="270" cy="470" r="112" fill="#ffffff"/>
  <circle cx="270" cy="470" r="96" fill="#eef9e4"/>
  <g transform="translate(270,440)">
    <rect x="-20" y="-28" width="40" height="56" rx="8" ry="8" fill="none" stroke="#80bb03" stroke-width="6"/>
    <circle cx="0" cy="18" r="2.5" fill="#80bb03"/>
  </g>
  <text x="270" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#374151">RT Phone</text>
  <text x="270" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#374151">Neutraliser</text>

  <!-- Neutraliser circle (top) -->
  <circle cx="400" cy="300" r="140" fill="url(#ring)"/>
  <circle cx="400" cy="300" r="122" fill="#ffffff"/>
  <circle cx="400" cy="300" r="104" fill="#eef9e4"/>
  <g transform="translate(400,260)">
    <path d="M0,-34 L30,-20 L30,10 C30,34 16,50 0,58 C-16,50 -30,34 -30,10 L-30,-20 Z" fill="none" stroke="#80bb03" stroke-width="7"/>
  </g>
  <text x="400" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#374151">Neutraliser</text>

  <!-- Activator circle (bottom right) -->
  <circle cx="530" cy="470" r="128" fill="url(#ring)"/>
  <circle cx="530" cy="470" r="112" fill="#ffffff"/>
  <circle cx="530" cy="470" r="96" fill="#eef9e4"/>
  <g transform="translate(530,440)">
    <polygon points="5,-30 -18,6 -2,6 -6,34 20,-4 2,-4" fill="#80bb03"/>
  </g>
  <text x="530" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#374151">Activator</text>

  <!-- top banner -->
  <rect x="100" y="80" width="600" height="88" rx="18" ry="18" fill="#ffffff" stroke="#80bb03" stroke-width="4"/>
  <text x="400" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#374151">COMPLETE</text>
  <text x="400" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#80bb03">PROTECTION SET</text>

  <!-- bottom tag -->
  <rect x="250" y="650" width="300" height="56" rx="28" ry="28" fill="#80bb03"/>
  <text x="400" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#ffffff">3-in-1 Bundle</text>
</svg>
